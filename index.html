<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>新竹公車 · 站牌看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 頁首：標題、搜尋、各種切換都在這裡 ============ -->
<header class="top">
  <div class="wrap topbar">
    <button class="back" id="backBtn" type="button" hidden data-i18n-aria="backAria">←</button>
    <div class="topmain">
      <p class="eyebrow"><span data-i18n="appEyebrow">新竹市區公車</span> <span class="clock num" id="clock">--:--</span></p>
      <h1 class="title" id="title" data-i18n="pickTitle">要去哪裡？</h1>
      <p class="sub" id="sub" data-i18n="pickSub">選一個站牌，看接下來會來什麼車</p>
    </div>
    <div class="headerTools">
      <button class="iconbtn" id="langBtn" type="button" title="Language / 語言">EN</button>
      <button class="iconbtn" id="themeBtn" type="button" aria-pressed="false" data-i18n-title="themeToggleToDark">☾</button>
      <button class="iconbtn bigtoggle" id="bigBtn" type="button" aria-pressed="false" data-i18n-title="bigToggleTitle">A+</button>
    </div>
  </div>

  <div class="wrap searchrow">
    <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder"
      placeholder="搜尋站牌或路線，例如「清華」或「81」" aria-label="搜尋站牌或路線" autocomplete="off">
    <button class="tbtn" id="nearBtn" type="button" data-i18n="nearBtn">附近站牌</button>
  </div>

  <div class="rail"><i id="railFill"></i></div>
  <div class="wrap railmeta">
    <b id="freshText" data-i18n="freshLive">資料即時更新中</b>
    <span class="age num" id="ageText">0 秒前</span>
  </div>
</header>

<!-- ============ 主體：左邊選站/看板，右邊地圖一直顯示 ============ -->
<div class="layout wrap">
  <div class="panel-left">

    <!-- 畫面一：選站 -->
    <section id="pickScreen">
      <div class="tripcard">
        <h2 class="tripheading" data-i18n="tripTitle">幫你規劃怎麼去</h2>
        <p class="tripcardsub" data-i18n="tripSub">打字告訴我你要去哪裡，我幫你找最適合的公車</p>
        <div class="triprow">
          <input id="tripQuery" type="text" data-i18n-placeholder="tripPlaceholder"
            placeholder="例如：我要從新竹火車站去內灣" autocomplete="off">
          <button class="tbtn" id="tripBtn" type="button" data-i18n="tripBtn">規劃路線</button>
        </div>
        <div id="tripResult"></div>
      </div>

      <div id="searchResults"></div>

      <div id="favBlock" hidden>
        <div class="sectionhead"><h2 data-i18n="favTitle">我的收藏</h2><span data-i18n="favHint">點星號可移除</span></div>
        <div class="list" id="favList"></div>
      </div>

      <div class="sectionhead"><h2 id="nearHead" data-i18n="nearHead">熱門站牌</h2><span id="nearNote" data-i18n="nearNote">按上面的「附近站牌」用定位排序</span></div>
      <div class="list" id="nearList"></div>
    </section>

    <!-- 畫面二：站牌看板 -->
    <section id="boardScreen" hidden>
      <div class="alert" id="alert" hidden></div>

      <div class="sectionhead">
        <h2 data-i18n="boardHead">接下來會來的車</h2>
        <span data-i18n="boardSub">依到站時間排序</span>
      </div>
      <div class="board" id="board"></div>
    </section>

  </div>

  <aside class="panel-right">
    <div class="mapbox mapbox--main">
      <div id="mainMap"></div>
      <button type="button" class="mapresetbtn" id="mapResetBtn" data-i18n-title="mapResetBtn" data-i18n-aria="mapResetBtn">⟲</button>
    </div>
    <p class="maphint" id="mapHint" data-i18n="mapPickHint">點地圖上的站牌圖示查看到站看板</p>
  </aside>
</div>

<div class="wrap">
  <!-- ============ 示範開關 ============ -->
  <div class="tools">
    <p data-i18n="toolsLabel">示範開關</p>
    <div class="toolrow">
      <button class="tbtn" id="incidentBtn" type="button" data-i18n="incidentBtnOff">模擬光復路事故</button>
      <button class="tbtn" id="freezeBtn" type="button" data-i18n="freezeBtnOff">模擬資料停止更新</button>
    </div>
  </div>

  <p class="foot" data-i18n="foot">
    示範用途，班次與到站時間皆為模擬產生，非真實資料。
  </p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/data.js?v=2"></script>
<script src="js/i18n.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/sim.js?v=2"></script>
<script src="js/routedist.js?v=2"></script>
<script src="js/plan.js?v=2"></script>
<script src="js/map.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
